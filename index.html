<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Calculator by JS</title>
	<link href="https://fonts.cdnfonts.com/css/digital" rel="stylesheet">
	<link rel="stylesheet" href="styles.css"></link>
	<script src="script.js" defer></script>
</head>
<body>
	<div class="title">
		<h2>CALCULATOR</h2>
		<p>by JS</p>
	</div>
	<div class="container">
		<div class="screen">
			<p class="number"></p>
		</div>
		<div class="buttons">
			<button id="ac">ac</button>
			<button id="del">del</button>
			<button id="op">/</button>
			<button id="num">7</button>
			<button id="num">8</button>
			<button id="num">9</button>
			<button id="op">×</button>
			<button id="num">4</button>
			<button id="num">5</button>
			<button id="num">6</button>
			<button id="op">-</button>
			<button id="num">1</button>
			<button id="num">2</button>
			<button id="num">3</button>
			<button id="op">+</button>
			<button id="num">.</button>
			<button id="num">0</button>
			<button id="e">=</button>
		</div>
	</div>
</body>
</html>
